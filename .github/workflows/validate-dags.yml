name: Validar DAGs

on:
  pull_request:
    paths: ["dags/**", "tests/**", "requirements-dev.txt", ".github/workflows/validate-dags.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install "apache-airflow==3.3.0" --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.0/constraints-3.11.txt
      - run: pip install pandas==2.2.3 pytest==8.4.1
      - run: airflow db migrate
      - run: python -m compileall -q dags
      - run: pytest -q
